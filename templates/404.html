<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f3ed" />
    <title>Page not found - {{ portfolio.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body id="top">
    <a class="skip" href="#main">Skip to content</a>

    <header class="header">
        <nav class="nav wrap" aria-label="Main navigation">
            <a class="brand" href="{{ url_for('home') }}" aria-label="{{ portfolio.name }}, home">
                <span class="brand-mark" aria-hidden="true">{{ portfolio.name[0]|lower }}.</span>{{ portfolio.name }}
            </a>
        </nav>
    </header>

    <main id="main" class="wrap">
        <section class="contact" aria-labelledby="not-found-title">
            <div>
                <p class="section-label">404 / NOT FOUND</p>
                <h2 id="not-found-title">Page not <em>found.</em></h2>
                <p>The address may be mistyped, or the page may have moved.</p>
            </div>
            <div>
                <a class="button" href="{{ url_for('home') }}">Back to portfolio <span aria-hidden="true">&#8593;</span></a>
            </div>
        </section>
    </main>

    <footer class="footer wrap">
        <span>&copy; {{ current_year }} {{ portfolio.name }}. All Rights Reserved.</span>
    </footer>
</body>
</html>
